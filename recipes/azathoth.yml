---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: azathoth
# description will be included in the image's metadata
description: This is my personal desktop OS image. The machine that runs this also functions as the always-on host for the core infrastructure of my home lab.

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/a0leaves/bazzbiri
image-version: latest

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  - type: files
    files:
      - source: system/usr/lib/tmpfiles.d/linger.conf
        destination: /
      - source: system/usr/lib/systemd/system/setsebool-jellyfin.service
        destination: /

  - type: systemd
    system:
      enabled:
        - setsebool-jellyfin.service
    user:
      enabled:
        - podman-auto-update.timer

  - from-file: common-modules.yml
