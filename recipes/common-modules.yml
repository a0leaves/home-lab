---
# yaml-language-server: $schema=https://schema.blue-build.org/module-v1.json

modules:
  - type: dnf
    repos:
        cleanup: true
        files:
          - https://raw.githubusercontent.com/terrapkg/packages/refs/heads/f44/anda/terra/release/terra.repo
        copr:
          - varlad/zellij
    install:
      packages:
        - zellij
        - walker

  - type: signing # this sets up the proper policy & signing files for signed images to work fully
